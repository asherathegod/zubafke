<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagon / Shield Base -->
  <polygon points="64,6 118,34 118,94 64,122 10,94 10,34" fill="url(#bgGrad)" stroke="#d4af37" stroke-width="3" filter="url(#glow)"/>

  <!-- Inner Ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Crossed Glaive / Sword Blades -->
  <g transform="translate(64,64) rotate(45) translate(-64,-64)">
    <path d="M60,18 L68,18 L68,90 L60,90 Z" fill="url(#bladeGrad)" stroke="#334155" stroke-width="1"/>
    <polygon points="64,8 56,22 72,22" fill="#d4af37"/>
    <rect x="52" y="88" width="24" height="6" rx="2" fill="#d4af37"/>
    <circle cx="64" cy="100" r="5" fill="#e74c3c"/>
  </g>

  <g transform="translate(64,64) rotate(-45) translate(-64,-64)">
    <path d="M60,18 L68,18 L68,90 L60,90 Z" fill="url(#bladeGrad)" stroke="#334155" stroke-width="1"/>
    <polygon points="64,8 56,22 72,22" fill="#d4af37"/>
    <rect x="52" y="88" width="24" height="6" rx="2" fill="#d4af37"/>
    <circle cx="64" cy="100" r="5" fill="#3498db"/>
  </g>

  <!-- Central Dragon / Flame Core -->
  <circle cx="64" cy="64" r="14" fill="#e74c3c" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="8" fill="#f1c40f"/>
  <circle cx="64" cy="64" r="3" fill="#ffffff"/>
</svg>
